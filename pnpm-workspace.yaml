overrides:
  undici: ^7.30.1

# pnpm 11 requires an explicit build-script decision per dependency. These
# three are not needed in CI: sharp ships prebuilt binaries, and
# onnxruntime-node/protobufjs builds only serve optional local ontology paths.
allowBuilds:
  onnxruntime-node: false
  protobufjs: false
  sharp: false
