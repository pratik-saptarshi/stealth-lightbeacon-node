image: node:26.13.1

pipelines:
  custom:
    stealth-lightbeacon-audit:
      - step:
          name: Run Security and AEO/GEO Site Audit
          caches:
            - node
          script:
            - npm install -g pnpm@11.4.0
            - pnpm install --frozen-lockfile
            - bash scripts/evals/node-version-gate.sh
            - pnpm run build
            - node dist/cli.js evaluate "https://example.com" --crawl-depth 1 --max-urls 5 --format both --out ./audit-results
          artifacts:
            - audit-results/**
  default:
    - step:
        name: Build and check signatures
        caches:
          - node
        script:
          - npm install -g pnpm@11.4.0
          - pnpm install --frozen-lockfile
          - bash scripts/evals/node-version-gate.sh
          - pnpm run build
          - pnpm run quality:check
